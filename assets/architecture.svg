<text x="1163.0" y="773" font-size="18" font-weight="600" fill="#8866b5" text-anchor="middle" >Usage</text>
<rect x="1233" y="745" width="281" height="42" rx="9" fill="#ffffff" stroke="#ead5b8" stroke-width="1.1"/>
<text x="1373.5" y="773" font-size="18" font-weight="600" fill="#8866b5" text-anchor="middle" >Source + version snapshots</text>
<text x="822" y="824" font-size="20" font-weight="500" fill="#1e3048" >Programs · receipts · timestamps · outcomes</text>
<text x="822" y="859" font-size="19" font-weight="400" fill="#64748b" >Evidence connects each revision to what actually happened</text>
<path d="M 564 540 H 650 V 630 H 840 V 670" fill="none" stroke="#8866b5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow_8866b5)"/>
<text x="665" y="610" font-size="17" font-weight="500" fill="#8866b5" >task trace</text>
<path d="M 992 558 V 670" fill="none" stroke="#8866b5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow_8866b5)"/>
<text x="1007" y="614" font-size="17" font-weight="500" fill="#8866b5" >execution trace</text>
<rect x="64" y="937" width="1482" height="91" rx="15" fill="#ecf7f2" stroke="#c4dfcf" stroke-width="1.5"/>
<text x="92" y="971" font-size="18" font-weight="700" fill="#319781" letter-spacing="0.8">CONTINUOUS IMPROVEMENT</text>
<text x="490" y="971" font-size="23" font-weight="600" fill="#1e3048" >Notice an issue → try a revision → check → save → reuse</text>
<text x="92" y="1007" font-size="20" font-weight="400" fill="#64748b" >The Agent chooses what to improve; the Runtime executes and the knowledge library carries it forward.</text>
<text x="64" y="1060" font-size="17" font-weight="400" fill="#64748b" >Arrows show information and execution flow. Hardware-specific control is supplied by the external adapter.</text>
</g></svg>
