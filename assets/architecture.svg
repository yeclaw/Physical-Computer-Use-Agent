<text x="94" y="238" font-size="28" font-weight="700" fill="#3979c6" >01  Agent</text>
<text x="96" y="274" font-size="19" font-weight="400" fill="#64748b" >Task + application context + relevant knowledge</text>
<rect x="96" y="296" width="436" height="54" rx="11" fill="#ffffff" stroke="#3979c6" stroke-width="1.4"/>
<text x="314.0" y="331" font-size="21" font-weight="500" fill="#1e3048" text-anchor="middle" >Observe + retrieve context</text>
