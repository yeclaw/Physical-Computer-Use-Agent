<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img">
<title>Physical Computer Use Agent: execution and continuous learning</title>
<desc>Four core components. The Agent writes programs and checks feedback, Runtime executes through an external adapter, Skills retain reusable experience, and Records preserve evidence. The right gripper observes a screen while the left gripper types.</desc>
<defs><marker id="arrow_3979c6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3979c6" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow_8866b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8866b5" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow_319781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#319781" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow_d88b35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#d88b35" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
