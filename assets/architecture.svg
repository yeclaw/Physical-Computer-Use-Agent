<text x="64" y="57" font-size="19" font-weight="700" fill="#3979c6" letter-spacing="1.8">PHYSICAL COMPUTER USE AGENT</text>
<text x="64" y="113" font-size="42" font-weight="700" fill="#1e3048" >Execute the task. Improve the skill.</text>
<text x="64" y="151" font-size="22" font-weight="400" fill="#64748b" >A fixed model learns through programs, feedback and persistent experience.</text>
<text x="1536" y="57" font-size="19" font-weight="500" fill="#64748b" text-anchor="end" >yeclaw</text>
