<text x="96" y="824" font-size="20" font-weight="500" fill="#1e3048" >Conditions · versions · device knowledge</text>
<text x="96" y="859" font-size="19" font-weight="400" fill="#64748b" >Retain, revise and reuse across tasks</text>
