<text x="452" y="614" font-size="17" font-weight="500" fill="#319781" >recall</text>
<rect x="790" y="676" width="756" height="210" rx="20" fill="#f3eefa" stroke="#8866b5" stroke-width="1.7"/>
<text x="820" y="722" font-size="28" font-weight="700" fill="#8866b5" >04  Records</text>
